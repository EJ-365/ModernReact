# Netlify: Vite static site + serverless API proxies
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/**"]

# ——— Authenticated / CORS proxies (serverless) ———
[[redirects]]
  from = "/api/flightaware/*"
  to = "/.netlify/functions/flightaware/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/adsblol/*"
  to = "/.netlify/functions/adsblol/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/opensky/*"
  to = "/.netlify/functions/opensky/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/adsbdb/*"
  to = "/.netlify/functions/adsbdb/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/hexdb/*"
  to = "/.netlify/functions/hexdb/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/tomtom/*"
  to = "/.netlify/functions/tomtom/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/transtar/*"
  to = "/.netlify/functions/transtar/:splat"
  status = 200
  force = true

# Open-Meteo / Nominatim: browser can call them directly (CORS).
# Keep edge rewrites as a fallback for older clients.
[[redirects]]
  from = "/api/openmeteo/*"
  to = "https://api.open-meteo.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/nominatim/*"
  to = "https://nominatim.openstreetmap.org/:splat"
  status = 200
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
