name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Install · lint shell · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify required pages exist
        run: |
          set -e
          for f in index.html about.html download.html app.html \
            docs/index.html docs/getting-started.html docs/architecture.html \
            docs/api-keys.html docs/desktop.html docs/contributing.html docs/ci.html \
            public/manifest.webmanifest public/sw.js public/site/site.css public/site/site.js
          do
            test -f "$f" || { echo "Missing $f"; exit 1; }
          done
          echo "Required surfaces OK"

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Check dist outputs
        run: |
          set -e
          test -f dist/index.html
          test -f dist/app.html
          test -f dist/about.html
          test -f dist/download.html
          test -d dist/docs
          echo "dist/ OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: houston-traffic-simulator-dist
          path: dist/
          retention-days: 14

  package-win:
    name: Package Windows zip
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install & package
        run: |
          npm ci
          npm run build
          npm run package:win

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: HoustonTrafficSimulator-Setup-win-x64
          path: downloads/HoustonTrafficSimulator-Setup-win-x64.zip
          if-no-files-found: warn
          retention-days: 30
