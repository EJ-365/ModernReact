name: Build and Deploy ChefClaude

on:
  push:
    branches:
      - main
    paths:
      - 'ChefClaude/src/**'
      - 'ChefClaude/netlify/**'
      - 'ChefClaude/package.json'
      - 'ChefClaude/vite.config.js'
      - '.github/workflows/deploy-chefclaude.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ChefClaude/package-lock.json

      - name: Install dependencies
        working-directory: ./ChefClaude
        run: npm ci

      - name: Build
        working-directory: ./ChefClaude
        run: npm run build

      - name: Commit dist folder
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add ChefClaude/dist
          git diff --staged --quiet || git commit -m "Build ChefClaude dist folder [skip ci]"
          git push
